.top-controls{

}
#langToggle,#calendarToggle{

}
#calendarToggle{padding:8px 12px}

  display:flex;align-items:center;justify-content:center;padding:20px;
}
.calendar-modal[hidden]{display:none}

  position:relative;
  width:min(360px,92vw);

  border-radius:20px;

}

.cal-grid{

}
.cal-dow{font-size:.72rem;color:#9b671b;font-weight:700;padding:2px 0}

  position:relative;padding:8px 0 6px;border-radius:8px;

.cal-events{display:flex;flex-direction:column;gap:8px;margin-top:4px}

.cal-add-btn:hover{background:#7a4d0d}

  z-index:1;
  pointer-events:none;

.petal{position:absolute;top:-50px;font-size:24px;opacity:.8;animation:fall linear infinite;will-change:transform}

      display: flex;

.event-media {
  width: min(280px, 78%);
  display: flex;
  justify-content: center;
  
  /* Apply the drop-shadow here so it molds perfectly to the video's irregular edges */
  filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.16));
}

.event-media video,
.event-media img {
  display: block;
  width: 100%;
  max-width: 280px;
  height: auto;
  max-height: 280px;
  object-fit: cover;

  /* Creates a highly uneven, asymmetric amorphous blob */
  border-radius: 30% 70% 40% 60% / 60% 40% 70% 30%;
  
  /* Adds a matching solid border if you still want a distinct outline */
  border: 1px solid rgba(255, 255, 255, 0.7);
}

<body>

  <canvas id="cloudSkyCanvas"></canvas>
     <!-- Animated sky background, adapted from the "Cloud Sky" WebGL shader (Background.js) into
       plain JS since this page is static HTML rather than a React app. Same shader math and
       default look/motion (coverage, size, softness, shadow, cirrus, sun glow, pointer parallax). -->
  <script>
      (function(){
        const MAX_DPR = 2;
        const NEAR_DRIFT = 0.055, FAR_DRIFT = 0.026, CIRRUS_DRIFT = 0.014;

        // Fixed uniform values, computed from the component's default props merged with its
        // exported preset (cirrus 100 / shadow 70 / softness 200, sun x100 y100 glow #fff,
        // pointer wind 300 / damping 50 / parallax 300, density 100, speed 64, size 130).
        const COVERAGE = 1.0;
        const SPEED = 1.28;
        const SIZE = 1.3;
        const SOFTNESS = 2.25;
        const SHADOW = 0.7;
        const CIRRUS = 1.0;
        const SUN_X = 1.0, SUN_Y = 1.0;
        const PARALLAX = 3.0, WIND = 3.0, DAMPING = 50;

        const ZENITH  = [0.0, 0.4588, 1.0];      // #0075FF
        const HORIZON = [0.7059, 0.8235, 0.9412];// #B4D2F0
        const CLOUD   = [1.0, 1.0, 1.0];         // #FFFFFF
        const GLOW    = [1.0, 1.0, 1.0, 1.0];    // #FFFFFF, alpha 1

        const VERT_SRC = "attribute vec2 a_pos; void main(){ gl_Position = vec4(a_pos, 0.0, 1.0); }";

        const FRAG_SRC = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    uniform vec2 uRes;
    uniform float uNearX, uFarX, uCirrusX;
    uniform float uCoverage, uSize, uSoftness, uShadow, uCirrus;
    uniform vec3 uZenith, uHorizon, uCloud;
    uniform vec4 uGlow;
    uniform vec2 uSun;
    uniform vec2 uParallax;

    vec2 hash22(vec2 p){
      vec3 q = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
      q += dot(q, q.yzx + 33.33);
      return fract((q.xx + q.yz) * q.zy);
    }

    float hash12(vec2 p){
      vec3 q = fract(vec3(p.xyx) * 0.1031);
      q += dot(q, q.yzx + 33.33);
      return fract((q.x + q.y) * q.z);
    }

    float vnoise(vec2 x){
      vec2 i = floor(x), f = fract(x);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash12(i), hash12(i + vec2(1.0, 0.0)), f.x),
                mix(hash12(i + vec2(0.0, 1.0)), hash12(i + vec2(1.0, 1.0)), f.x), f.y);
    }

    float fbm(vec2 p){
      float a = 0.5, s = 0.0;
      for (int i = 0; i < 4; i++){
        s += a * vnoise(p);
        p *= 2.03;
        a *= 0.5;
      }
      return s;
    }

    vec2 blobs(vec2 uv, float seed){
      vec2 id = floor(uv), f = fract(uv);

      float best = -1e4;
      float wsum = 0.0, ysum = 0.0;
      float wMax = min(2.150, 0.72 * uSize);
      float reach = min(2.0, ceil(wMax + 0.85) - 1.0);
      for (int j = -2; j <= 2; j++){
        for (int i = -2; i <= 2; i++){
          vec2 o = vec2(float(i), float(j));
          if (max(abs(o.x), abs(o.y)) > reach) continue;
          vec2 h = hash22(id + o + seed);

          if (fract(h.x * 37.1) > uCoverage) continue;
          vec2 c = o + 0.15 + h * 0.7;
          float w = min(2.150, (0.30 + 0.42 * fract(h.y * 19.7)) * uSize);
          vec2 d = f - c;

          float ry = (d.y > 0.0 ? 0.340 : 0.190) * uSize * (0.8 + 0.5 * fract(h.y * 7.3));
          float e = length(vec2(d.x / max(w, 1e-3), d.y / max(ry, 1e-3)));
          float val = 1.0 - e;
          float yN = d.y / max(ry, 1e-3);
          if (val > best){
            float k = exp(12.0 * (best - val));
            wsum = wsum * k + 1.0;
            ysum = ysum * k + yN;
            best = val;
          } else {
            float g = exp(12.0 * (val - best));
            wsum += g;
            ysum += g * yN;
          }
        }
      }
      return vec2(best, ysum / max(wsum, 1e-4));
    }

    vec2 cloudField(vec2 uv, float seed, float detailScale){
      vec2 b = blobs(uv, seed);

      float n = fbm(uv * detailScale + seed * 3.1) * 0.72
              + fbm(uv * detailScale * 3.3 + seed * 7.7) * 0.28;
      return vec2(b.x - (1.0 - n) * 0.700, b.y);
    }

    vec3 shadeCloud(float dyNorm, vec3 sky){
      float t = smoothstep(-0.95, 0.25, dyNorm);
      vec3 base = mix(uCloud * 0.52, sky, 0.34);
      return mix(mix(uCloud, base, uShadow), uCloud, t);
    }

    void main(){
      vec2 frag = gl_FragCoord.xy / max(uRes.y, 1.0);
      float aspect = uRes.x / max(uRes.y, 1.0);
      vec2 p = vec2(frag.x, frag.y);

      vec3 sky = mix(uHorizon, uZenith, smoothstep(-0.15, 1.05, p.y));
      vec2 sunP = vec2(uSun.x * aspect, uSun.y);
      float sd = length(p - sunP);

      sky += uGlow.rgb * uGlow.a * exp(-sd * 3.4) * 0.30;

      vec3 col = sky;

      if (uCirrus > 0.0) {
        vec2 cuv = vec2(p.x * 1.4 + uCirrusX, p.y * 5.5);
        float veil = fbm(cuv) * fbm(cuv * 2.3 + 9.0);
        veil = smoothstep(0.24, 0.55, veil) * smoothstep(0.15, 0.7, p.y);
        col = mix(col, uCloud, veil * uCirrus * 0.5);
      }

      vec2 fuv = vec2(p.x + uFarX, p.y) * 2.150 + uParallax * 0.4;
      vec2 fd = cloudField(fuv, 17.0, 11.0);
      float fa = clamp(fd.x * uSoftness, 0.0, 1.0);
      if (fa > 0.0) {
        vec3 lit = shadeCloud(fd.y, sky);

        col = mix(col, mix(lit, sky, 0.550), fa);
      }

      vec2 nuv = vec2(p.x + uNearX, p.y) * 1.050 + uParallax;
      vec2 nd = cloudField(nuv, 3.0, 8.5);
      float na = clamp(nd.x * uSoftness, 0.0, 1.0);
      if (na > 0.0) {
        vec3 lit = shadeCloud(nd.y, sky);

        float above = clamp(cloudField(nuv + vec2(0.0, 0.085), 3.0, 8.5).x * uSoftness, 0.0, 1.0);
        lit *= 1.0 - 0.18 * uShadow * above;

        lit += uGlow.rgb * uGlow.a * 0.22 * exp(-length(p - sunP) * 1.6);
        col = mix(col, lit, na);
      }

      gl_FragColor = vec4(col, 1.0);
    }
    `;

        function compile(gl, type, src){
          const sh = gl.createShader(type);
          gl.shaderSource(sh, src);
          gl.compileShader(sh);
          if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
            console.error("CloudSky shader:", gl.getShaderInfoLog(sh));
            gl.deleteShader(sh);
            return null;
          }
          return sh;
        }

        function initCloudSky(){
          const canvas = document.getElementById('cloudSkyCanvas');
          if (!canvas) return;
          const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false });
          if (!gl){ console.error('CloudSky: WebGL unavailable'); return; }

          const vs = compile(gl, gl.VERTEX_SHADER, VERT_SRC);
          const fs = compile(gl, gl.FRAGMENT_SHADER, FRAG_SRC);
          if (!vs || !fs) return;

          const prog = gl.createProgram();
          gl.attachShader(prog, vs);
          gl.attachShader(prog, fs);
          gl.linkProgram(prog);
          if (!gl.getProgramParameter(prog, gl.LINK_STATUS)){
            console.error('CloudSky link:', gl.getProgramInfoLog(prog));
            return;
          }
          gl.useProgram(prog);

          const buf = gl.createBuffer();
          gl.bindBuffer(gl.ARRAY_BUFFER, buf);
          gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
          const aPos = gl.getAttribLocation(prog, 'a_pos');
          gl.enableVertexAttribArray(aPos);
          gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

          const locs = {};
          function u(name){
            if (!(name in locs)) locs[name] = gl.getUniformLocation(prog, name);
            return locs[name];
          }

          let last = performance.now();
          let nearX = 0, farX = 0, cirrusX = 0, leanX = 0, leanY = 0;
          const ptr = { x: 0, y: 0 };
          // adding code for Gyro 
            const gyro = { x: 0, y: 0, active: false };

            window.addEventListener('pointermove', function(e){
              ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
              ptr.y = 1 - (e.clientY / window.innerHeight) * 2;
            });

            function handleOrientation(e){
              if (e.gamma === null || e.beta === null) return;
              const gamma = Math.max(-45, Math.min(45, e.gamma));       // left-right tilt
              const beta  = Math.max(-45, Math.min(45, e.beta - 45));   // front-back tilt (offset for natural hold angle)
              gyro.x = gamma / 45;
              gyro.y = -beta / 45;
              gyro.active = true;
            }

            if (window.DeviceOrientationEvent) {
              if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                // iOS 13+ requires a tap before it will grant sensor access
                document.body.addEventListener('click', function requestGyro(){
                  DeviceOrientationEvent.requestPermission().then(function(state){
                    if (state === 'granted') window.addEventListener('deviceorientation', handleOrientation);
                  }).catch(function(){});
                  document.body.removeEventListener('click', requestGyro);
                }, { once: true });
              } else {
                // Android Chrome and others fire this with no permission prompt
                window.addEventListener('deviceorientation', handleOrientation);
              }
            }
          // gyro ends

          window.addEventListener('pointermove', function(e){
            ptr.x = (e.clientX / window.innerWidth) * 2 - 1;
            ptr.y = 1 - (e.clientY / window.innerHeight) * 2;
          });

          function render(now){
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;

            const k = 1 - Math.exp(-DAMPING * 0.12 * dt);
            // leanX += (ptr.x - leanX) * k;
            // leanY += (ptr.y - leanY) * k;
            // Adding Gyro effect below
            const px = gyro.active ? gyro.x : ptr.x;
            const py = gyro.active ? gyro.y : ptr.y;
            leanX += (px - leanX) * k;
            leanY += (py - leanY) * k;

            const gust = 1 + leanX * WIND;
            const rate = SPEED * gust;
            nearX = (nearX - NEAR_DRIFT * rate * dt) % 1000;
            farX = (farX - FAR_DRIFT * rate * dt) % 1000;
            cirrusX = (cirrusX - CIRRUS_DRIFT * rate * dt) % 1000;

            const dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
            const cw = canvas.clientWidth || window.innerWidth;
            const ch = canvas.clientHeight || window.innerHeight;
            const bw = Math.max(1, Math.round(cw * dpr));
            const bh = Math.max(1, Math.round(ch * dpr));
            if (canvas.width !== bw || canvas.height !== bh){
              canvas.width = bw;
              canvas.height = bh;
            }
            gl.viewport(0, 0, bw, bh);

            gl.uniform2f(u('uRes'), bw, bh);
            gl.uniform1f(u('uNearX'), nearX);
            gl.uniform1f(u('uFarX'), farX);
            gl.uniform1f(u('uCirrusX'), cirrusX);
            gl.uniform1f(u('uCoverage'), COVERAGE);
            gl.uniform1f(u('uSize'), SIZE);
            gl.uniform1f(u('uSoftness'), SOFTNESS);
            gl.uniform1f(u('uShadow'), SHADOW);
            gl.uniform1f(u('uCirrus'), CIRRUS);
            gl.uniform2f(u('uSun'), SUN_X, SUN_Y);
            gl.uniform2f(u('uParallax'), -leanX * PARALLAX * 0.07, -leanY * PARALLAX * 0.05);
            gl.uniform3f(u('uZenith'), ZENITH[0], ZENITH[1], ZENITH[2]);
            gl.uniform3f(u('uHorizon'), HORIZON[0], HORIZON[1], HORIZON[2]);
            gl.uniform3f(u('uCloud'), CLOUD[0], CLOUD[1], CLOUD[2]);
            gl.uniform4f(u('uGlow'), GLOW[0], GLOW[1], GLOW[2], GLOW[3]);

            gl.drawArrays(gl.TRIANGLES, 0, 3);
            requestAnimationFrame(render);
          }

          requestAnimationFrame(render);
        }

        if (document.readyState === 'loading'){
          document.addEventListener('DOMContentLoaded', initCloudSky);
        } else {
          initCloudSky();
        }
      })();
      </script>

  <!-- Calendar modal: Dec 2026, 12th & 13th highlighted, Add to Google Calendar -->
  <script>
  (function(){
    const modal = document.getElementById('calendarModal');
    const toggleBtn = document.getElementById('calendarToggle');
    const closeBtn = document.getElementById('calClose');
    const prevBtn = document.getElementById('calPrev');
    const nextBtn = document.getElementById('calNext');
    const monthLabel = document.getElementById('calMonthLabel');
    const grid = document.getElementById('calGrid');

    let viewYear = 2026, viewMonth = 11; // December 2026 (0-indexed)

    const monthNames = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const dow = ["S","M","T","W","T","F","S"];

    function renderCalendar(){
      grid.innerHTML = "";
      dow.forEach(function(d){
        const el = document.createElement('div');
        el.className = 'cal-dow';
        el.textContent = d;
        grid.appendChild(el);
      });
      monthLabel.textContent = monthNames[viewMonth] + " " + viewYear;

      const firstDay = new Date(viewYear, viewMonth, 1).getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++){
        const el = document.createElement('div');
        el.className = 'cal-day empty';
        grid.appendChild(el);
      }
      for (let day = 1; day <= daysInMonth; day++){
        const el = document.createElement('div');
        const isHeartDay = (viewYear === 2026 && viewMonth === 11 && (day === 12 || day === 13));
        el.className = 'cal-day' + (isHeartDay ? ' heart' : '');
        el.innerHTML = isHeartDay ? (day + '<span class="heart-icon">❤️</span>') : String(day);
        grid.appendChild(el);
      }
    }

    toggleBtn.addEventListener('click', function(){
      modal.hidden = false;
      renderCalendar();
    });
    closeBtn.addEventListener('click', function(){ modal.hidden = true; });
    modal.addEventListener('click', function(e){ if (e.target === modal) modal.hidden = true; });
    prevBtn.addEventListener('click', function(){
      viewMonth--; if (viewMonth < 0){ viewMonth = 11; viewYear--; }
      renderCalendar();
    });
    nextBtn.addEventListener('click', function(){
      viewMonth++; if (viewMonth > 11){ viewMonth = 0; viewYear++; }
      renderCalendar();
    });

    function buildGCalLink(title, startUTC, endUTC, details, location){
      const base = 'https://www.google.com/calendar/render?action=TEMPLATE';
      const params = new URLSearchParams({
        text: title,
        dates: startUTC + '/' + endUTC,
        details: details,
        location: location
      });
      return base + '&' + params.toString();
    }

    // Reception: Sat 12 Dec 2026, 6:00 PM - 9:00 PM IST  -> 12:30-15:30 UTC
    document.getElementById('addReception').addEventListener('click', function(){
      const link = buildGCalLink(
        'Reception - Suganth Weds Indhuvathana',
        '20261212T123000Z',
        '20261212T153000Z',
        'Reception celebration at Mayoora Mahal',
        'Mayoora Mahal'
      );
      window.open(link, '_blank');
    });

    // Wedding Muhurtham: Sun 13 Dec 2026, 4:00 AM - 5:00 AM IST -> 22:30-23:30 UTC on 12 Dec
    document.getElementById('addWedding').addEventListener('click', function(){
      const link = buildGCalLink(
        'Wedding Muhurtham - Suganth and Indhuvathana Muhurtham',
        '20261212T223000Z',
        '20261212T233000Z',
        'Wedding ceremony at Mayoora Mahal',
        'Mayoora Mahal'
      );
      window.open(link, '_blank');
    });
  })();
  </script>
